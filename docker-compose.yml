version: "3.8"

services:
  db:
    image: postgres:16
    container_name: lunarpunk_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: lunarpunk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - lunarpunk_pgdata:/var/lib/postgresql/data

volumes:
  lunarpunk_pgdata:
